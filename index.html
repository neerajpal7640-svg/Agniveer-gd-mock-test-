<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agniveer GD 30 Day</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#111}.h{background:#0b3d91;color:white;padding:18px;text-align:center}.c{max-width:650px;margin:auto;padding:15px}.card{background:white;padding:18px;border-radius:15px;margin:12px 0;box-shadow:0 2px 10px #0002}button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:9px;font-size:16px;background:#0b3d91;color:white}.o{background:#e9eef5;color:#111;text-align:left}.sel{outline:3px solid #0b3d91}.lock{background:#888}.hide{display:none}.top{display:flex;justify-content:space-between;font-weight:bold}</style><body><div class=h><h2>🇮🇳 Agniveer GD</h2>30-Day Mock Test</div><div class=c><div id=home class=card><h3>Daily Test</h3><p>हर दिन 50 MCQ • Day 1 उपलब्ध</p><div id=days></div></div><div id=test class="card hide"><div class=top><span id=n></span><span id=t>30:00</span></div><hr><h3 id=q></h3><div id=o></div><button onclick=next()>Next</button></div><div id=res class="card hide"><h2>🎉 Result</h2><h2 id=sc></h2><button onclick=review()>गलत प्रश्न देखें</button><button onclick=location.reload()>Home</button><div id=rv></div></div></div><script>
const qs=[
['भारत का राष्ट्रीय पशु कौन है?',['शेर','बाघ','हाथी','हिरण'],1],['भारतीय संविधान कब लागू हुआ?',['15 अगस्त 1947','26 नवंबर 1949','26 जनवरी 1950','2 अक्टूबर 1950'],2],['जल का रासायनिक सूत्र?',['CO₂','H₂O','O₂','H₂'],1],['पृथ्वी का प्राकृतिक उपग्रह?',['मंगल','सूर्य','चंद्रमा','शुक्र'],2],['25×4=?',['75','90','100','125'],2],['5 दर्जन में कितनी वस्तुएँ?',['50','60','72','48'],1],['2,4,8,16,?',['20','24','30','32'],3],['भारत की राजधानी?',['मुंबई','नई दिल्ली','लखनऊ','जयपुर'],1],['रक्त पंप करने वाला अंग?',['फेफड़ा','मस्तिष्क','हृदय','गुर्दा'],2],['100 का 25%?',['15','20','25','30'],2],['सूर्य के सबसे निकट ग्रह?',['पृथ्वी','बुध','शुक्र','मंगल'],1],['वायुमंडल में सबसे अधिक गैस?',['ऑक्सीजन','नाइट्रोजन','CO₂','हाइड्रोजन'],1],['विटामिन C की कमी से?',['रिकेट्स','स्कर्वी','रातांधता','बेरी-बेरी'],1],['बल की SI इकाई?',['जूल','वाट','न्यूटन','पास्कल'],2],['पौधों में भोजन बनाने की प्रक्रिया?',['श्वसन','प्रकाश संश्लेषण','वाष्पोत्सर्जन','अंकुरण'],1],['12+18÷3=?',['10','18','24','30'],2],['5 पेन ₹50, 1 पेन?',['₹5','₹10','₹15','₹20'],1],['त्रिभुज के कोणों का योग?',['90°','180°','270°','360°'],1],['15 का 20%?',['2','3','4','5'],1],['3/4 प्रतिशत में?',['25%','50%','75%','80%'],2],['5,10,15,20,?',['22','24','25','30'],2],['दिन का विलोम?',['सुबह','रात','शाम','दोपहर'],1],['CAT→DBU, DOG→?',['EPH','EOG','DPH','FPH'],0],['एक वर्ष में महीने?',['10','11','12','13'],2],['राष्ट्रीय ध्वज के डिजाइनर?',['पिंगली वेंकैया','गांधीजी','नेहरू','राजेंद्र प्रसाद'],0],['वंदे मातरम् के लेखक?',['टैगोर','बंकिम चंद्र चट्टोपाध्याय','सरोजिनी नायडू','प्रेमचंद'],1],['जन गण मन के रचयिता?',['बंकिम चंद्र','रवीन्द्रनाथ टैगोर','सुभाष बोस','भारतेंदु'],1],['उत्तर प्रदेश की राजधानी?',['कानपुर','प्रयागराज','लखनऊ','वाराणसी'],2],['गणतंत्र दिवस?',['15 अगस्त','26 जनवरी','2 अक्टूबर','14 नवंबर'],1],['संसद के दो सदन?',['लोकसभा-विधानसभा','राज्यसभा-विधानसभा','लोकसभा-राज्यसभा','विधानसभा-विधान परिषद'],2],['मानव शरीर का सबसे बड़ा अंग?',['हृदय','त्वचा','यकृत','फेफड़ा'],1],['मानव शरीर में हड्डियाँ?',['196','206','216','226'],1],['रक्त का लाल रंग किससे?',['प्लाज्मा','हीमोग्लोबिन','कैल्शियम','इंसुलिन'],1],['विद्युत धारा की SI इकाई?',['वोल्ट','ओम','एम्पियर','वाट'],2],['प्रतिरोध की इकाई?',['ओम','वोल्ट','एम्पियर','जूल'],0],['प्रकाश की गति लगभग?',['3×10⁸ m/s','3×10⁶ m/s','3×10⁵ m/s','3×10⁴ m/s'],0],['₹500 पर 10% छूट?',['₹25','₹40','₹50','₹60'],2],['50%=40, संख्या?',['60','70','80','90'],2],['24 और 36 का HCF?',['6','8','12','18'],2],['12 और 18 का LCM?',['24','30','36','48'],2],['₹100 खरीद, ₹120 बिक्री: लाभ%?',['10%','15%','20%','25%'],2],['60 km/h से 2 घंटे दूरी?',['100','120','140','160'],1],['A=1,B=2,C=3 तो CAB?',['5','6','7','8'],1],['1,4,9,16,?',['20','24','25','36'],2],['पूर्व 5km, पश्चिम 3km: स्थिति?',['2 km पूर्व','2 km पश्चिम','8 km पूर्व','8 km पश्चिम'],0],['भारत की सबसे लंबी नदी?',['यमुना','गंगा','नर्मदा','गोदावरी'],1],['पृथ्वी की सतह का लगभग कितना भाग जल?',['51%','61%','71%','81%'],2],['ओजोन परत मुख्यतः?',['क्षोभमंडल','समतापमंडल','मध्यमंडल','तापमंडल'],1],['पानी का क्वथनांक सामान्य दाब पर?',['0°C','50°C','100°C','212°C'],2]
];let i=0,ans=[],score=0,left=1800,id;const $=x=>document.getElementById(x);function init(){for(let d=1;d<=30;d++){let b=document.createElement('button');b.textContent='Day '+d+(d==1?' ▶':' 🔒');b.disabled=d!=1;if(d!=1)b.className='lock';if(d==1)b.onclick=start;$('days').append(b)}}function start(){$('home').className='card hide';$('test').className='card';i=0;ans=[];score=0;left=1800;id=setInterval(()=>{left--;let m=Math.floor(left/60),s=left%60;$('t').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0)finish()},1000);show()}function show(){let x=qs[i];$('n').textContent='Question '+(i+1)+' / 50';$('q').textContent=x[0];$('o').innerHTML='';x[1].forEach((v,k)=>{let b=document.createElement('button');b.className='o';b.textContent=String.fromCharCode(65+k)+') '+v;b.onclick=()=>{ans[i]=k;[...$('o').children].forEach(z=>z.classList.remove('sel'));b.classList.add('sel')};$('o').append(b)})}function next(){if(ans[i]===undefined)return alert('पहले answer चुनो');if(i==49)return finish();i++;show()}function finish(){clearInterval(id);score=qs.reduce((s,x,k)=>s+(ans[k]===x[2]?1:0),0);localStorage.setItem('day1score',score);$('test').className='card hide';$('res').className='card';$('sc').textContent=score+'/50  ('+(score*2)+'%)'}function review(){$('rv').innerHTML='<h3>गलत/छोड़े गए प्रश्न</h3>'+qs.map((x,k)=>ans[k]!==x[2]?'<p><b>'+(k+1)+'. '+x[0]+'</b><br>सही: '+x[1][x[2]]+'</p>':'').join('')}init();</script></body></html>
