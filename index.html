<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90 Days Challenge - Neeraj Pal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        .main-card {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 950px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            margin: 20px 0;
        }

        /* नीरज पाल नाम की प्रीमियम डिज़ाइन */
        .name-header {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #128807 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 20px rgba(255, 153, 51, 0.3);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #d1d1d1;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* बैकग्राउंड इमेज अपलोड बटन */
        .upload-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn-upload {
            border: 2px dashed #FF9933;
            color: #FF9933;
            background-color: rgba(255, 153, 51, 0.1);
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-upload:hover {
            background-color: #FF9933;
            color: #121212;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* 90 दिनों की ग्रिड (Grid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 15px;
            max-height: 480px;
            overflow-y: auto;
            padding: 10px;
        }

        .grid-container::-webkit-scrollbar {
            width: 8px;
        }

        .grid-container::-webkit-scrollbar-thumb {
            background: #FF9933;
            border-radius: 10px;
        }

        /* प्रत्येक दिन का कार्ड */
        .day-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px 8px;
            transition: all 0.3s ease;
            position: relative;
            user-select: none;
        }

        .day-box.unlocked {
            background: rgba(40, 167, 69, 0.25);
            border-color: #28a745;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }

        .day-box.unlocked:hover {
            transform: translateY(-3px);
            background: rgba(40, 167, 69, 0.35);
        }

        .day-box.locked {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.08);
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .day-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.unlocked { background: #28a745; color: #fff; }
        .status-badge.locked { background: #dc3545; color: #fff; }

        .score-text {
            font-size: 0.85rem;
            color: #ffca28;
            margin-top: 6px;
            font-weight: 600;
        }

        /* स्कोर इनपुट पॉपअप विंडो (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .modal h3 {
            color: #FF9933;
            margin-bottom: 10px;
        }

        .modal input {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            margin: 15px 0 20px;
            outline: none;
        }

        .modal input:focus {
            border-color: #FF9933;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-submit { background: #28a745; color: #fff; }
        .btn-cancel { background: #dc3545; color: #fff; }

        @media (max-width: 600px) {
            .name-header { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="main-card">
        <h1 class="name-header">NEERAJ PAL</h1>
        <div class="subtitle">90-Day Target Unlock Challenge</div>

        <!-- फोटो अपलोड करने का विकल्प -->
        <div class="upload-section">
            <div class="upload-btn-wrapper">
                <button class="btn-upload">📷 Upload Background Image</button>
                <input type="file" id="bgUploader" accept="image/*" onchange="changeBackground(event)">
            </div>
        </div>

        <!-- Day 1 से Day 90 तक का ग्रिड -->
        <div class="grid-container" id="daysGrid"></div>
    </div>

    <!-- प्रतिशत स्कोर भरने का मॉडल -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal">
            <h3 id="modalTitle">Day Marks Entry</h3>
            <p style="margin-top: 8px; color: #ccc; font-size: 0.9rem;">अगला दिन खोलने के लिए कम से कम <b>70%</b> अंक दर्ज करें:</p>
            <input type="number" id="scoreInput" placeholder="Enter % (0-100)" min="0" max="100">
            <div class="btn-group">
                <button class="btn btn-submit" onclick="saveScore()">Submit Score</button>
                <button class="btn btn-cancel" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_DAYS = 90;
        let selectedDay = 1;

        // लोकल स्टोरेज से पिछला डेटा लोड करें
        let savedData = JSON.parse(localStorage.getItem('neeraj_90day_tracker')) || {
            unlockedUpTo: 1,
            scores: {},
            bgImage: ''
        };

        // अगर इमेज सेव है तो ऑटोमैटिक सेट करें
        if (savedData.bgImage) {
            document.body.style.backgroundImage = `url('${savedData.bgImage}')`;
        }

        // नई इमेज अपलोड करने का फ़ंक्शन
        function changeBackground(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageData = e.target.result;
                    document.body.style.backgroundImage = `url('${imageData}')`;
                    savedData.bgImage = imageData;
                    localStorage.setItem('neeraj_90day_tracker', JSON.stringify(savedData));
                };
                reader.readAsDataURL(file);
            }
        }

        // पूरे 90 दिनों की ग्रिड तैयार करना
        function buildGrid() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let day = 1; day <= TOTAL_DAYS; day++) {
                const isUnlocked = day <= savedData.unlockedUpTo;
                const score = savedData.scores[day];

                const dayCard = document.createElement('div');
                dayCard.className = `day-box ${isUnlocked ? 'unlocked' : 'locked'}`;
                
                dayCard.innerHTML = `
                    <div class="day-title">Day ${day}</div>
                    <span class="status-badge ${isUnlocked ? 'unlocked' : 'locked'}">
                        ${isUnlocked ? 'Unlocked' : 'Locked'}
                    </span>
                    ${score !== undefined ? `<div class="score-text">Score: ${score}%</div>` : ''}
                `;

                if (isUnlocked) {
                    dayCard.onclick = () => openModal(day);
                }

                grid.appendChild(dayCard);
            }
        }

        function openModal(day) {
            selectedDay = day;
            document.getElementById('modalTitle').innerText = `Day ${day} Evaluation`;
            document.getElementById('scoreInput').value = savedData.scores[day] !== undefined ? savedData.scores[day] : '';
            document.getElementById('scoreModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = 'none';
        }

        function saveScore() {
            const val = parseFloat(document.getElementById('scoreInput').value);

            if (isNaN(val) || val < 0 || val > 100) {
                alert('कृपया 0 से 100 के बीच सही प्रतिशत दर्ज करें!');
                return;
            }

            savedData.scores[selectedDay] = val;

            // 70% या उससे अधिक होने पर अगला दिन खुलेगा
            if (val >= 70) {
                if (selectedDay === savedData.unlockedUpTo && selectedDay < TOTAL_DAYS) {
                    savedData.unlockedUpTo = selectedDay + 1;
                    alert(`बधाई हो! ${val}% प्राप्त करने पर Day ${selectedDay + 1} अनलॉक हो गया है!`);
                } else {
                    alert(`Day ${selectedDay} का स्कोर अपडेट हो गया: ${val}%`);
                }
            } else {
                alert(`आपका स्कोर ${val}% है। अगला दिन अनलॉक करने के लिए कम से कम 70% अंक चाहिए!`);
            }

            localStorage.setItem('neeraj_90day_tracker', JSON.stringify(savedData));
            closeModal();
            buildGrid();
        }

        // पेज लोड पर ग्रिड बनाना
        buildGrid();
    </script>
</body>
</html>
