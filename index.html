<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Agniveer GD 30 Day Mock Test</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d91">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#111;
}

.header{
  background:#0b3d91;
  color:white;
  text-align:center;
  padding:20px 12px;
}

.header h1{
  margin:0 0 6px;
  font-size:25px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 2px 12px #0002;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin:6px 0;
  font-size:16px;
  cursor:pointer;
  background:#0b3d91;
  color:white;
}

button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.day{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  background:#eef2f7;
}

.day button{
  width:auto;
  min-width:120px;
  margin:0;
}

.locked{
  background:#ddd;
  color:#666;
}

.completed{
  background:#e3f5e8;
}

.progress{
  height:10px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}

.progressBar{
  height:100%;
  background:#0b3d91;
  width:0%;
}

.top{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:17px;
}

.timer{
  color:#c62828;
}

.option{
  background:#edf1f6;
  color:#111;
  text-align:left;
}

.option.selected{
  outline:3px solid #0b3d91;
  background:#dce8ff;
}

.result{
  text-align:center;
}

.score{
  font-size:34px;
  font-weight:bold;
  color:#0b3d91;
}

.stat{
  display:flex;
  justify-content:space-around;
  text-align:center;
  margin:15px 0;
}

.stat div{
  padding:10px;
}

.correct{
  color:green;
}

.wrong{
  color:red;
}

.unanswered{
  color:#777;
}

.hidden{
  display:none;
}

.reviewBox{
  border-top:1px solid #ddd;
  padding:12px 0;
}

.small{
  font-size:13px;
  color:#666;
}
</style>
</head>

<body>

<div class="header">
  <h1>🇮🇳 Agniveer GD</h1>
  <div>30-Day Daily Mock Test</div>
</div>

<div class="container">

<!-- HOME -->
<div id="home" class="card">

  <h2>📚 Daily Mock Test</h2>

  <p>
    रोज़ 50 प्रश्न • 30 मिनट • Day-by-Day Practice
  </p>

  <div class="progress">
    <div id="progressBar" class="progressBar"></div>
  </div>

  <p id="progressText"></p>

  <div id="days"></div>

</div>


<!-- TEST -->
<div id="test" class="card hidden">

  <div class="top">
    <span id="questionNumber">Question 1 / 50</span>
    <span id="timer" class="timer">30:00</span>
  </div>

  <hr>

  <h3 id="question"></h3>

  <div id="options"></div>

  <button onclick="nextQuestion()">Next ➜</button>

</div>


<!-- RESULT -->
<div id="result" class="card hidden result">

  <h2>🎉 Test Complete</h2>

  <div id="score" class="score">0/50</div>

  <p id="percentage"></p>

  <div class="stat">

    <div>
      <b class="correct" id="correctCount">0</b>
      <br>
      Correct
    </div>

    <div>
      <b class="wrong" id="wrongCount">0</b>
      <br>
      Wrong
    </div>

    <div>
      <b class="unanswered" id="unansweredCount">0</b>
      <br>
      Unanswered
    </div>

  </div>

  <button onclick="showReview()">
    📖 गलत प्रश्न देखें
  </button>

  <button onclick="goHome()">
    🏠 Home
  </button>

  <div id="review"></div>

</div>

</div>

/* =========================
   VARIABLES
========================= */

let currentDay = 1;
let currentQuestion = 0;
let answers = [];
let score = 0;
let timeLeft = 1800;
let timerID = null;


/* =========================
   LOCAL STORAGE
========================= */

function getCompletedDay(){

  return parseInt(
    localStorage.getItem("completedDay") || "0"
  );

}


function saveCompletedDay(day){

  localStorage.setItem(
    "completedDay",
    day
  );

}


/* =========================
   HOME / DAYS
========================= */

function init(){

  showDays();

}


function showDays(){

  const completed = getCompletedDay();

  const daysBox = document.getElementById("days");

  daysBox.innerHTML = "";

  for(let day=1; day<=30; day++){

    const row = document.createElement("div");

    row.className = "day";

    if(day <= completed){
      row.classList.add("completed");
    }

    const title = document.createElement("span");

    if(day <= completed){

      title.textContent =
        "Day " + day + " ✅ Complete";

    }else if(day === completed + 1){

      title.textContent =
        "Day " + day + " 🔓 Available";

    }else{

      title.textContent =
        "Day " + day + " 🔒 Locked";

    }

    row.appendChild(title);


    const btn = document.createElement("button");

    if(day <= completed){

      btn.textContent = "फिर से दें";

      btn.onclick = function(){

        startTest(day);

      };

    }
    else if(day === completed + 1){

      btn.textContent = "Start ▶";

      btn.onclick = function(){

        startTest(day);

      };

    }
    else{

      btn.textContent = "Locked";

      btn.disabled = true;

    }

    row.appendChild(btn);

    daysBox.appendChild(row);

  }


  const progress =
    Math.min(completed / 30 * 100,100);

  document.getElementById(
    "progressBar"
  ).style.width = progress + "%";


  document.getElementById(
    "progressText"
  ).textContent =
    "Progress: " + completed + " / 30 Days Complete";

}


/* =========================
   START TEST
========================= */

function startTest(day){

  currentDay = day;

  currentQuestion = 0;

  answers = [];

  score = 0;

  timeLeft = 1800;


  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("test")
    .classList.remove("hidden");


  clearInterval(timerID);


  timerID = setInterval(function(){

    timeLeft--;

    updateTimer();

    if(timeLeft <= 0){

      finishTest();

    }

  },1000);


  showQuestion();

}


/* =========================
   TIMER
========================= */

function updateTimer(){

  let minutes =
    Math.floor(timeLeft / 60);

  let seconds =
    timeLeft % 60;

  document.getElementById("timer")
    .textContent =
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0");

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  const q =
    questionBank[currentQuestion];


  document.getElementById(
    "questionNumber"
  ).textContent =
    "Day " + currentDay +
    " • Question " +
    (currentQuestion + 1) +
    " / 50";


  document.getElementById(
    "question"
  ).textContent = q[0];


  const options =
    document.getElementById("options");

  options.innerHTML = "";


  q[1].forEach(function(option,index){

    const button =
      document.createElement("button");

    button.className = "option";

    button.textContent =
      String.fromCharCode(65+index)
      + ") "
      + option;


    button.onclick = function(){

      answers[currentQuestion] =
        index;


      document
        .querySelectorAll(".option")
        .forEach(function(btn){

          btn.classList.remove(
            "selected"
          );

        });


      button.classList.add(
        "selected"
      );

    };


    options.appendChild(button);

  });


  if(
    answers[currentQuestion] !== undefined
  ){

    const selected =
      answers[currentQuestion];

    options.children[selected]
      .classList.add("selected");

  }


}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

  if(
    answers[currentQuestion] === undefined
  ){

    alert("पहले एक answer चुनो।");

    return;

  }


  if(currentQuestion === 49){

    finishTest();

    return;

  }


  currentQuestion++;

  showQuestion();

}


/* =========================
   FINISH TEST
========================= */

function finishTest(){

  clearInterval(timerID);


  score = 0;

  let wrong = 0;

  let unanswered = 0;


  for(
    let i=0;
    i<50;
    i++
  ){

    if(
      answers[i] === undefined
    ){

      unanswered++;

    }
    else if(
      answers[i] === questionBank[i][2]
    ){

      score++;

    }
    else{

      wrong++;

    }

  }


  /*
   Unlock next day only when
   current day is completed.
  */

  const completed =
    getCompletedDay();


  if(currentDay > completed){

    saveCompletedDay(currentDay);

  }


  document.getElementById(
    "test"
  ).classList.add("hidden");


  document.getElementById(
    "result"
  ).classList.remove("hidden");


  document.getElementById(
    "score"
  ).textContent =
    score + " / 50";


  document.getElementById(
    "percentage"
  ).textContent =
    "Percentage: " +
    (score * 2) +
    "%";


  document.getElementById(
    "correctCount"
  ).textContent =
    score;


  document.getElementById(
    "wrongCount"
  ).textContent =
    wrong;


  document.getElementById(
    "unansweredCount"
  ).textContent =
    unanswered;


  document.getElementById(
    "review"
  ).innerHTML = "";


}


/* =========================
   REVIEW WRONG QUESTIONS
========================= */

function showReview(){

  const box =
    document.getElementById("review");

  box.innerHTML =
    "<h3>📖 Revision</h3>";


  for(
    let i=0;
    i<50;
    i++
  ){

    if(
      answers[i] !== questionBank[i][2]
    ){

      const q =
        questionBank[i];


      const div =
        document.createElement("div");

      div.className =
        "reviewBox";


      let yourAnswer =
        answers[i] === undefined
        ? "कोई answer नहीं"
        : q[1][answers[i]];


      div.innerHTML =
        "<b>Q"+(i+1)+". "
        + q[0]
        + "</b><br><br>"
        + "आपका उत्तर: "
        + yourAnswer
        + "<br>"
        + "<span class='correct'>सही उत्तर: "
        + q[1][q[2]]
        + "</span>";


      box.appendChild(div);

    }

  }

}


/* =========================
   HOME
========================= */

function goHome(){

  document.getElementById(
    "result"
  ).classList.add("hidden");


  document.getElementById(
    "test"
  ).classList.add("hidden");


  document.getElementById(
    "home"
  ).classList.remove("hidden");


  showDays();

}


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker
    .register("./sw.js")
    .catch(function(error){

      console.log(
        "Service Worker Error:",
        error
      );

    });

}


/* START */
init();

</script>

</body>
  </html>
