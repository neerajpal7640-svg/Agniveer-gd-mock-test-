<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90 Days Challenge - Neeraj Pal</title>
    <!-- Google Fonts for stylish Neeraj Pal heading -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* बैकग्राउंड इमेज की सेटिंग */
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        /* बैकग्राउंड को डार्क और क्लियर लुक देने के लिए ओवरले */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        /* मुख्य कंटेनर */
        .main-card {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 900px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            margin: 20px 0;
        }

        /* नीरज पाल नाम की प्रीमियम डिज़ाइन */
        .name-header {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #128807 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 20px rgba(255, 153, 51, 0.3);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #d1d1d1;
            letter-spacing: 1px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
        }

        /* 90 Days Card Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            max-height: 480px;
            overflow-y: auto;
            padding: 10px;
        }

        /* स्क्रॉलबार स्टाइलिंग */
        .grid-container::-webkit-scrollbar {
            width: 8px;
        }
        .grid-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #FF9933;
            border-radius: 10px;
        }

        /* दिन का कार्ड (Day Box) */
        .day-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px 10px;
            transition: all 0.3s ease;
            position: relative;
            user-select: none;
        }

        /* अनलॉक्ड डे */
        .day-box.unlocked {
            background: rgba(40, 167, 69, 0.25);
            border-color: #28a745;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }

        .day-box.unlocked:hover {
            transform: translateY(-3px);
            background: rgba(40, 167, 69, 0.35);
        }

        /* लॉक्ड डे */
        .day-box.locked {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.08);
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .day-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.unlocked {
            background: #28a745;
            color: #ffffff;
        }

        .status-badge.locked {
            background: #dc3545;
            color: #ffffff;
        }

        .score-text {
            font-size: 0.85rem;
            color: #ffca28;
            margin-top: 6px;
            font-weight: 600;
        }

        /* मार्क्स इनपुट पॉपअप (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .modal h3 {
            margin-bottom: 10px;
            color: #FF9933;
        }

        .modal p {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
        }

        .modal input {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .modal input:focus {
            border-color: #FF9933;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit {
            background: #28a745;
            color: #fff;
        }

        .btn-submit:hover {
            background: #218838;
        }

        .btn-cancel {
            background: #dc3545;
            color: #fff;
        }

        .btn-cancel:hover {
            background: #c82333;
        }

        @media (max-width: 600px) {
            .name-header {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="main-card">
        <!-- आपका नाम स्टाइलिश डिज़ाइन में -->
        <h1 class="name-header">NEERAJ PAL</h1>
        <div class="subtitle">90-Day Target Unlock Challenge</div>

        <!-- 90 Days Dynamic Grid -->
        <div class="grid-container" id="daysGrid"></div>
    </div>

    <!-- 70% अंक भरने का पॉपअप विंडो -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal">
            <h3 id="modalTitle">Day Marks</h3>
            <p>अगला दिन अनलॉक करने के लिए कम से कम <b>70%</b> अंक दर्ज करें:</p>
            <input type="number" id="scoreInput" placeholder="Enter % (0-100)" min="0" max="100">
            <div class="btn-group">
                <button class="btn btn-submit" onclick="saveScore()">Submit Score</button>
                <button class="btn btn-cancel" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_DAYS = 90;
        let selectedDay = 1;

        // सेव किया हुआ डेटा लोड करें
        let savedData = JSON.parse(localStorage.getItem('neeraj_90day_tracker')) || {
            unlockedUpTo: 1,
            scores: {}
        };

        // दिनों का ग्रिड तैयार करने वाला फ़ंक्शन
        function buildGrid() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let day = 1; day <= TOTAL_DAYS; day++) {
                const isUnlocked = day <= savedData.unlockedUpTo;
                const score = savedData.scores[day];

                const dayCard = document.createElement('div');
                dayCard.className = `day-box ${isUnlocked ? 'unlocked' : 'locked'}`;
                
                dayCard.innerHTML = `
                    <div class="day-title">Day ${day}</div>
                    <span class="status-badge ${isUnlocked ? 'unlocked' : 'locked'}">
                        ${isUnlocked ? 'Unlocked' : 'Locked'}
                    </span>
                    ${score !== undefined ? `<div class="score-text">Score: ${score}%</div>` : ''}
                `;

                if (isUnlocked) {
                    dayCard.onclick = () => openModal(day);
                }

                grid.appendChild(dayCard);
            }
        }

        function openModal(day) {
            selectedDay = day;
            document.getElementById('modalTitle').innerText = `Day ${day} Evaluation`;
            document.getElementById('scoreInput').value = savedData.scores[day] !== undefined ? savedData.scores[day] : '';
            document.getElementById('scoreModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = 'none';
        }

        function saveScore() {
            const val = parseFloat(document.getElementById('scoreInput').value);

            if (isNaN(val) || val < 0 || val > 100) {
                alert('कृपया 0 से 100 के बीच में प्रतिशत भरें!');
                return;
            }

            // स्कोर सेव करना
            savedData.scores[selectedDay] = val;

            // अगर 70% या ज्यादा है तो अगला दिन खोलना
            if (val >= 70) {
                if (selectedDay === savedData.unlockedUpTo && selectedDay < TOTAL_DAYS) {
                    savedData.unlockedUpTo = selectedDay + 1;
                    alert(`शाबाश! ${val}% स्कोर के साथ Day ${selectedDay + 1} अनलॉक हो गया है!`);
                } else {
                    alert(`Day ${selectedDay} का स्कोर अपडेट हुआ: ${val}%`);
                }
            } else {
                alert(`आपका स्कोर ${val}% है। अगला दिन खोलने के लिए 70% या उससे अधिक की आवश्यकता है!`);
            }

            // ब्राउज़र में सुरक्षित सेव करें
            localStorage.setItem('neeraj_90day_tracker', JSON.stringify(savedData));

            closeModal();
            buildGrid();
        }

        // पेज चालू होते ही ग्रिड बनाएं
        buildGrid();
    </script>
</body>
</html>
